[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboozle"
version = "0.7.0"
description = "Bamboozle reversible semantic cipher, structured translation, and encrypted exchange"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastmcp>=4.0.10",
    "markdown-it-py>=4.2.0,<5",
    "PyYAML>=6.0.3,<7",
]

[project.scripts]
bamboozle = "bamboozle.cli:main"
vigiles = "bamboozle.cli:main"
scm-cipher = "bamboozle.cipher:main"
scm-mcp = "bamboozle.scm_mcp:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "mypy",
    "pyright",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bamboozle*", "workshop*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
bamboozle = ["cipher_dict.json", "profanity_dict.json"]
"workshop.scrape" = ["taxonomy.json"]
"workshop.mcp" = ["taxonomy.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
