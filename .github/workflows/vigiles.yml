name: Vigiles

on:
  push:
    paths: ["bamboozle/**", ".github/workflows/vigiles.yml"]
  pull_request:
    paths: ["bamboozle/**", ".github/workflows/vigiles.yml"]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bamboozle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.5"
          python-version: ${{ matrix.python }}
          working-directory: bamboozle
      - run: uv sync --locked --dev
      - run: uv run --locked python scripts/verify.py --package
